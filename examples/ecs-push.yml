# The ordinary case: merging to main deploys to prod, merging to develop
# deploys to dev. Copy this to .github/workflows/cd.yml in the project.
#
# Notice what is *not* here: no project name, no ECR repository, no service.
# Those are derived from the calling repository by the registry in
# exerra-ai-org/deploy, so this repository can only ever deploy itself.

name: CD

on:
  push:
    branches: [main, develop]

jobs:
  prod:
    if: github.ref == 'refs/heads/main'
    uses: exerra-ai-org/deploy/.github/workflows/ecs.yml@main
    with:
      cluster: agency-prod
      health-url: https://api.acrm.example.com/health
    secrets: inherit

  dev:
    if: github.ref == 'refs/heads/develop'
    uses: exerra-ai-org/deploy/.github/workflows/ecs.yml@main
    with:
      cluster: agency-dev
    secrets: inherit
