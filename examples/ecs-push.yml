# Copy to .github/workflows/cd.yml in the project.
#
# Notice what is not here: no secrets block, no role ARN, no project name, no
# ECR repository, no service. The app is derived from this repository and the
# role ARN follows from it, so a repository can only ever deploy itself.
#
# `environment:` is required. It is half of the OIDC subject, so without it the
# token says :ref:refs/heads/main and matches no trust policy.

name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    uses: exerra-ai-org/deploy/.github/workflows/ecs.yml@main
    with:
      aws-account-id: "294342039646"
      cluster: agency-prod
      health-url: https://api.example.com/health
