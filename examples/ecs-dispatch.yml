# For a project where a deploy interrupts work in progress and a person should
# have to acknowledge it.

name: CD

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm'
        required: true
        default: ''

jobs:
  deploy:
    environment: production
    uses: exerra-ai-org/deploy/.github/workflows/ecs.yml@main
    with:
      aws-account-id: "294342039646"
      cluster: agency-prod
      health-url: https://api.example.com/health
      require-confirm: true
      confirm: ${{ inputs.confirm }}
