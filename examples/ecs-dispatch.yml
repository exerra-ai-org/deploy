# For a project where a deploy costs something a person should acknowledge.

name: CD

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm'
        required: true
        default: ''

jobs:
  deploy:
    uses: exerra-ai-org/deploy/.github/workflows/ecs.yml@main
    with:
      cluster: agency-prod
      health-url: https://api.franchiseos.example.com/health
      require-confirm: true
      confirm: ${{ inputs.confirm }}
    secrets: inherit
