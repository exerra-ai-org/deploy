# Ship a build artefact to an EC2 instance over SSM.
#
# The other lane. Use this for something that is not in a container and is not
# going to be: the dialer runs FreeSWITCH alongside the application, holds long
# lived SIP registrations and RTP sockets, and is pinned to one box on purpose.
#
#   jobs:
#     deploy:
#       uses: exerra-ai-org/deploy/.github/workflows/ssm-release.yml@v1
#       with:
#         project: dialer
#         artifact-name: release-${{ github.sha }}
#         install-root: /opt/dialer
#         service: dialer
#         health-url: http://localhost:4000/health
#         aws-region: us-east-1
#         require-confirm: true
#         confirm: ${{ inputs.confirm }}
#       secrets: inherit
#
# The runner never opens an SSH session. It assumes a role through OIDC, puts a
# tarball in S3, and asks SSM to run a script on the instance. Port 22 stays
# closed to everything but your own address, and there is no key to leak.
#
# Expects the calling workflow to have already uploaded the build as an actions
# artefact. Build once, deploy that exact artefact: rebuilding at deploy time
# ships something nobody tested.

name: Release over SSM

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Actions artefact to download, produced by the calling workflow's build job.
        required: true
        type: string
      install-root:
        description: Directory on the instance holding `releases/` and the `current` symlink.
        required: true
        type: string
      service:
        description: systemd unit to restart.
        required: true
        type: string
      health-url:
        description: Checked on the instance after the restart. Failure rolls the symlink back.
        required: true
        type: string
      run-user:
        description: Owner of the unpacked release on the instance.
        required: false
        type: string
        default: ''
      migrate-command:
        description: >-
          Optional command run from inside the new release directory before the
          symlink moves, relative to it. Empty means no migration step.
        required: false
        type: string
        default: ''
      artifact-bucket:
        description: S3 bucket the instance pulls the release from.
        required: true
        type: string
      deploy-group:
        description: >-
          Value of the DeployGroup tag on the instances this platform manages.
          Targeting is by tag rather than by instance id so that a caller
          cannot name someone else's machine: the App tag comes from the
          registry, not from the caller.
        required: false
        type: string
        default: exerra
      environment-file:
        description: >-
          Read by the migration, as the systemd unit reads it. SSM runs as root
          with a bare environment, so without this the release starts with none
          of its configuration and refuses to boot.
        required: false
        type: string
        default: ''
      aws-region:
        required: false
        type: string
        default: eu-west-2
      keep-releases:
        description: How many old releases to leave on disk for rollback.
        required: false
        type: number
        default: 5
      settle-seconds:
        description: Seconds to wait after the restart before the first health check.
        required: false
        type: number
        default: 8
      confirm:
        required: false
        type: string
        default: ''
      require-confirm:
        required: false
        type: boolean
        default: true
    secrets:
      AWS_DEPLOY_ROLE_ARN:
        description: >-
          Role the runner assumes through OIDC. The only secret here: it names
          an account. No AWS key is stored anywhere.
        required: true

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ github.repository }} to ${{ inputs.service }}
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      # Deploying here is not free: on the dialer it logs out every agent and
      # stops every campaign, and nothing resumes on boot. The person most
      # likely to press this without knowing that is the one who has not read
      # the runbook, so the guard is an input rather than a note.
      - name: Refuse unless somebody meant it
        if: inputs.require-confirm
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Type DEPLOY to confirm. This restarts ${{ inputs.service }}."
            exit 1
          fi

      # ---- who is calling, and what may they touch -------------------------
      #
      # The app is derived from the calling repository, never taken as an
      # input. That is the whole separation: a repository can only ever write
      # to its own S3 prefix and send commands to its own instances, whatever
      # it passes in.
      #
      # Taking `app` as an input would make the prefixes housekeeping rather
      # than a boundary -- any repository could call this workflow with another
      # app's name and deploy over it. The registry below is the boundary, and
      # it lives in this file, in a repository whose main branch requires a
      # review, so adding an app is a reviewed change rather than a workflow
      # input.
      #
      # A repository not listed here cannot deploy at all, which is the correct
      # default for a role trusted by an entire organisation.
      - name: Resolve the calling repository to an app
        id: app
        run: |
          set -euo pipefail
          cat > /tmp/apps.json <<'REGISTRY'
          {
            "exerra-ai-org/dialer":     "dialer",
            "exerra-ai-org/ACRM":       "acrm",
            "exerra-ai-org/franchiseOS":"franchiseos",
            "exerra-ai-org/linkedout":  "linkedout",
            "exerra-ai-org/rusrus":     "rusrus"
          }
          REGISTRY

          app=$(jq -r --arg r "${{ github.repository }}" '.[$r] // empty' /tmp/apps.json)

          if [ -z "$app" ]; then
            echo "::error::${{ github.repository }} is not a registered app."
            echo "::error::Add it to the registry in exerra-ai-org/deploy and get the change reviewed."
            exit 1
          fi

          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "Calling repository ${{ github.repository }} resolves to app '$app'"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: rel/${{ steps.app.outputs.app }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      # Actions artefacts do not preserve the executable bit, so anything that
      # has to run is made executable again before it is packed. Without this
      # the release unpacks onto the instance and the unit fails to start with
      # "Permission denied" against a file that is plainly there.
      - name: Pack and upload
        run: |
          set -euo pipefail
          find "rel/${{ steps.app.outputs.app }}/bin" -type f -exec chmod +x {} + 2>/dev/null || true
          find "rel/${{ steps.app.outputs.app }}" -path '*/erts-*/bin/*' -type f -exec chmod +x {} + 2>/dev/null || true
          # releases/<vsn>/elixir and iex too. bin/<app> execs elixir, so
          # without this the release unpacks and then fails with
          #   exec: .../releases/0.1.0/elixir: Permission denied
          # which names the script rather than its mode.
          find "rel/${{ steps.app.outputs.app }}" -regextype posix-extended \
            -regex '.*/releases/[^/]+/(elixir|iex)' -type f -exec chmod +x {} + 2>/dev/null || true
          tar czf "${{ steps.app.outputs.app }}-${{ github.sha }}.tar.gz" -C rel "${{ steps.app.outputs.app }}"
          aws s3 cp "${{ steps.app.outputs.app }}-${{ github.sha }}.tar.gz" \
            "s3://${{ inputs.artifact-bucket }}/${{ steps.app.outputs.app }}/releases/"

      - name: Deploy over SSM
        id: ssm
        run: |
          set -euo pipefail

          # Written to a file and passed as one parameter rather than as a JSON
          # array of lines. Quoting a shell script through --parameters is where
          # deploy scripts go to die: a quote in a health URL or a migrate
          # command silently truncates the script.
          cat > /tmp/remote.sh <<'REMOTE'
          #!/bin/bash
          # The shebang is load-bearing. SSM's AWS-RunShellScript writes these
          # commands to a file and runs it with /bin/sh, which on Ubuntu is
          # dash. dash has no `pipefail`, so without this the script dies on its
          # first line with
          #
          #   _script.sh: 1: set: Illegal option -o pipefail
          #
          # having done nothing -- and SSM reports it as a plain "Failed", which
          # reads like the deploy went wrong rather than never started.
          set -euo pipefail
          SHA="__SHA__"
          ROOT="__ROOT__"
          PROJECT="__PROJECT__"
          SERVICE="__SERVICE__"
          BUCKET="__BUCKET__"
          HEALTH="__HEALTH__"
          RUN_USER="__RUN_USER__"
          MIGRATE="__MIGRATE__"
          ENVFILE="__ENVFILE__"
          KEEP="__KEEP__"
          SETTLE="__SETTLE__"

          PREV="$(readlink -f "$ROOT/current" || true)"
          echo "previous release: ${PREV:-none}"

          aws s3 cp "s3://$BUCKET/$PROJECT/releases/$PROJECT-$SHA.tar.gz" /tmp/
          rm -rf "$ROOT/releases/$SHA"
          mkdir -p "$ROOT/releases/$SHA"
          tar xzf "/tmp/$PROJECT-$SHA.tar.gz" -C "$ROOT/releases/$SHA" --strip-components=1
          # An if rather than a bare . That form is safe under
          # set -e -- verified, bash does not exit when the failing command is a
          # non-final part of an && list -- but every reader has to stop and
          # check that, which is a poor trade for one saved line.
          if [ -n "$RUN_USER" ]; then
            chown -R "$RUN_USER:$RUN_USER" "$ROOT/releases/$SHA"
          fi

          if [ -n "$MIGRATE" ]; then
            echo "migrating"
            if [ -n "$ENVFILE" ]; then
              # systemd-run with the unit's own EnvironmentFile rather than
              # exporting variables by hand: pass them by hand and one of them
              # eventually goes missing, and a release that cannot see its
              # database reports "Migrations already up" against an empty one.
              systemd-run \
                ${RUN_USER:+--uid="$RUN_USER" --gid="$RUN_USER"} \
                --property=EnvironmentFile="$ENVFILE" \
                --property=WorkingDirectory="$ROOT/releases/$SHA" \
                --wait --collect --pipe --quiet \
                /bin/sh -c "$MIGRATE"
            else
              ( cd "$ROOT/releases/$SHA" && eval "$MIGRATE" )
            fi
          fi

          ln -sfn "$ROOT/releases/$SHA" "$ROOT/current"
          systemctl restart "$SERVICE"
          sleep "$SETTLE"

          if ! curl -fsS --max-time 10 "$HEALTH"; then
            echo "health check failed; rolling back"
            if [ -n "$PREV" ]; then
              ln -sfn "$PREV" "$ROOT/current"
              systemctl restart "$SERVICE"
              sleep "$SETTLE"
              curl -fsS --max-time 10 "$HEALTH" && echo "rolled back and healthy" || echo "ROLLED BACK AND STILL UNHEALTHY"
            else
              echo "no previous release to roll back to"
            fi
            exit 1
          fi

          echo "healthy"
          ls -1dt "$ROOT/releases/"* | tail -n +$((KEEP + 1)) | xargs -r rm -rf
          REMOTE

          sed -i \
            -e "s|__SHA__|${{ github.sha }}|g" \
            -e "s|__ROOT__|${{ inputs.install-root }}|g" \
            -e "s|__PROJECT__|${{ steps.app.outputs.app }}|g" \
            -e "s|__SERVICE__|${{ inputs.service }}|g" \
            -e "s|__BUCKET__|${{ inputs.artifact-bucket }}|g" \
            -e "s|__HEALTH__|${{ inputs.health-url }}|g" \
            -e "s|__RUN_USER__|${{ inputs.run-user }}|g" \
            -e "s|__MIGRATE__|${{ inputs.migrate-command }}|g" \
            -e "s|__ENVFILE__|${{ inputs.environment-file }}|g" \
            -e "s|__KEEP__|${{ inputs.keep-releases }}|g" \
            -e "s|__SETTLE__|${{ inputs.settle-seconds }}|g" \
            /tmp/remote.sh

          # Targeted by tag, not by instance id. The App tag comes from the
          # registry rather than from the caller, so a repository cannot send a
          # command to another app's machine even if it knows the id. It also
          # means adding a second instance needs no change here -- tag it and it
          # is in.
          APP="${{ steps.app.outputs.app }}"
          command_id=$(aws ssm send-command \
            --targets "Key=tag:DeployGroup,Values=${{ inputs.deploy-group }}" \
                      "Key=tag:App,Values=$APP" \
            --document-name AWS-RunShellScript \
            --comment "deploy $APP ${{ github.sha }} by ${{ github.actor }}" \
            --parameters commands="$(jq -Rs '[.]' < /tmp/remote.sh)" \
            --query Command.CommandId --output text)

          echo "ssm command $command_id"
          echo "id=$command_id" >> "$GITHUB_OUTPUT"

          # SendCommand succeeds when the tags match nothing at all -- it simply
          # runs on zero instances and reports Success. That is the failure most
          # likely to be mistaken for a deploy, so it is checked explicitly and
          # loudly rather than left to look like one.
          instances=""
          for _ in $(seq 1 10); do
            instances=$(aws ssm list-command-invocations \
              --command-id "$command_id" \
              --query 'CommandInvocations[].InstanceId' --output text)
            [ -n "$instances" ] && break
            sleep 3
          done

          if [ -z "$instances" ]; then
            echo "::error::No instance matched DeployGroup=${{ inputs.deploy-group }} App=$APP."
            echo "::error::Tag the instance with both, or it cannot be deployed to."
            exit 1
          fi

          echo "targeted: $instances"

          failed=0
          for instance in $instances; do
            echo "── $instance ─────────────────────────────────────────"

            # `wait command-executed` exits non-zero when the command failed,
            # which is a legitimate outcome to report rather than let kill the
            # step here.
            aws ssm wait command-executed \
              --command-id "$command_id" --instance-id "$instance" || true

            aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$instance" \
              --query StandardOutputContent --output text

            aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$instance" \
              --query StandardErrorContent --output text >&2

            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$instance" \
              --query Status --output text)

            echo "$instance: $status"
            [ "$status" = "Success" ] || failed=1
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::deploy failed (each instance has rolled itself back)"
            exit 1
          fi

      - name: Say what is running
        run: |
          echo "### ${{ steps.app.outputs.app }} deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| unit | ${{ inputs.service }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
