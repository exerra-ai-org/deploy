# Build an image and put it on ECS Fargate.
#
# Called by a project's own .github/workflows/cd.yml. That file should be about
# ten lines; everything that is the same for every project is here, once.
#
#   jobs:
#     deploy:
#       uses: exerra-ai-org/deploy/.github/workflows/ecs.yml@v1
#       with:
#         project: acrm
#         cluster: agency-prod
#         service: acrm-service
#         ecr-repository: acrm
#         task-family: acrm
#       secrets: inherit
#
# What this does that copying deploy-ecs.yml into each repo did not:
#
#   1. It registers a new task definition revision pointing at the image it
#      just built. The previous workflow pushed <repo>:<sha> to ECR and then
#      called `update-service --force-new-deployment`, which re-runs whatever
#      revision the service already had. The Terraform that creates a service
#      sets `image = "nginx:alpine"` as a placeholder and then
#      `ignore_changes = [task_definition]`, so nothing else was ever going to
#      change it. Deploys pushed an image that nothing ran.
#   2. It waits for the deployment to stabilise instead of returning the moment
#      the API call is accepted. A task that crash-loops used to report a green
#      deploy.
#   3. It rolls back to the previous task definition if the deployment fails or
#      the health check does not answer.

name: Deploy to ECS

on:
  workflow_call:
    inputs:
      aws-account-id:
        description: >-
          Account the role lives in. An input, not a secret: an account id
          appears in every ARN in every log, and masking a non-secret is how a
          wrong value stays invisible -- an INSTANCE_ID secret holding an
          account id once cost three deploys, because the failing ARN rendered
          as "managed-instance/***" and read as correct.
        required: true
        type: string
      environment:
        description: >-
          GitHub environment, which is half of the OIDC subject and therefore
          decides which account the token can open. The calling job must declare
          the same one.
        required: false
        type: string
        default: production
      cluster:
        description: >-
          ECS cluster, e.g. agency-prod. A property of the environment rather
          than of the app, so it stays an input. The ECR repository, service,
          task family and container name are all derived from the calling
          repository instead -- see the registry step.
        required: true
        type: string
      component:
        description: >-
          A second service in the same repository, e.g. "frontend". The app
          becomes <app>-<component>, so ACRM's two services are acrm and
          acrm-frontend.

          Appended to the app the registry resolved rather than replacing it: a
          repository still cannot address another project, only its own
          components.
        required: false
        type: string
        default: ''
      build-args:
        description: >-
          Docker build arguments, one KEY=VALUE per line. For Vite apps these
          are the configuration: import.meta.env is inlined at build time, so
          the API URL and anon key are baked into the bundle and changing them
          means rebuilding, not restarting.
        required: false
        type: string
        default: ''
      ecr-namespace:
        description: Optional prefix on the ECR repository name, e.g. "exerra".
        required: false
        type: string
        default: ''
      service-suffix:
        description: Appended to the app name to form the ECS service name.
        required: false
        type: string
        default: -service
      aws-region:
        required: false
        type: string
        default: eu-west-2
      docker-context:
        description: Build context. Set this for a monorepo.
        required: false
        type: string
        default: '.'
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      health-url:
        description: >-
          Optional URL to check after the service stabilises. A stable service is
          one whose tasks stayed running; it is not a service that can reach its
          database. If this is set and does not answer, the deploy rolls back.
        required: false
        type: string
        default: ''
      wait-minutes:
        description: How long to wait for the service to stabilise before calling it failed.
        required: false
        type: number
        default: 10
      confirm:
        description: Pass the workflow_dispatch input here when require-confirm is true.
        required: false
        type: string
        default: ''
      require-confirm:
        description: >-
          Refuse to deploy unless `confirm` is the literal string DEPLOY. For
          projects where a restart has a cost somebody should have to
          acknowledge.
        required: false
        type: boolean
        default: false

concurrency:
  # One deploy per *service* at a time, not per repository. Without the
  # component, a repository with two services puts both jobs in one group: the
  # first runs, the second queues, and GitHub cancels the queued one the moment
  # anything else arrives. It shows up as a job cancelled in zero seconds with
  # no error, which reads like a workflow fault rather than a collision.
  #
  # Still not cancel-in-progress: interrupting a deploy half way leaves the
  # service on a revision nobody chose.
  group: deploy-${{ github.repository }}-${{ inputs.component }}-${{ inputs.cluster }}
  cancel-in-progress: false

jobs:
  deploy:
    # The environment is declared here, not by the caller. A job that calls a
    # reusable workflow accepts only uses/with/secrets/needs/if/permissions/
    # strategy/concurrency -- `environment` on such a job is rejected outright,
    # and GitHub reports it as "this run likely failed because of a workflow
    # file issue" with a zero-second run and no annotation naming the key.
    #
    # It has to be here anyway: the environment is half of the OIDC subject, so
    # it must apply to the job that actually requests the token.
    environment: ${{ inputs.environment }}
    name: ${{ github.repository }} to ${{ inputs.cluster }}
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Refuse unless somebody meant it
        if: inputs.require-confirm
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Type DEPLOY to confirm. This restarts ${{ github.repository }}."
            exit 1
          fi

      # ---- who is calling, and what may they touch -------------------------
      #
      # The app is derived from the calling repository, never taken as an
      # input. That is the whole separation: a repository can only ever write
      # to its own S3 prefix and send commands to its own instances, whatever
      # it passes in.
      #
      # Taking `app` as an input would make the prefixes housekeeping rather
      # than a boundary -- any repository could call this workflow with another
      # app's name and deploy over it. The registry below is the boundary, and
      # it lives in this file, in a repository whose main branch requires a
      # review, so adding an app is a reviewed change rather than a workflow
      # input.
      #
      # A repository not listed here cannot deploy at all, which is the correct
      # default for a role trusted by an entire organisation.
      - name: Resolve the calling repository to an app
        id: app
        run: |
          set -euo pipefail
          cat > /tmp/apps.json <<'REGISTRY'
          {
            "exerra-ai-org/dialer":     "dialer",
            "exerra-ai-org/ACRM":       "acrm",
            "exerra-ai-org/franchiseOS":"franchiseos",
            "exerra-ai-org/linkedout":  "linkedout",
            "exerra-ai-org/rusrus":     "rusrus",
            "exerra-ai-org/Truck-Engine":"trucking"
          }
          REGISTRY

          app=$(jq -r --arg r "${{ github.repository }}" '.[$r] // empty' /tmp/apps.json)

          if [ -z "$app" ]; then
            echo "::error::${{ github.repository }} is not a registered app."
            echo "::error::Add it to the registry in exerra-ai-org/deploy and get the change reviewed."
            exit 1
          fi

          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "Calling repository ${{ github.repository }} resolves to app '$app'"

          # The registry decides the base; the component only narrows it further.
          component="${{ inputs.component }}"
          [ -n "$component" ] && app="${app}-${component}"
          echo "app=$app" >> "$GITHUB_OUTPUT"

          ns="${{ inputs.ecr-namespace }}"
          echo "ecr-repository=${ns:+$ns/}$app" >> "$GITHUB_OUTPUT"
          echo "service=${app}${{ inputs.service-suffix }}" >> "$GITHUB_OUTPUT"
          echo "task-family=$app" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Derived, never supplied. The app comes from the calling repository,
          # so a repository cannot name another app's role -- and a role per app
          # costs no per-repository secret.
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id }}:role/exerra-deploy-${{ steps.app.outputs.app }}-${{ inputs.environment }}
          aws-region: ${{ inputs.aws-region }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tagged with the commit, never with a moving tag. A moving tag makes
      # "which code is running" unanswerable, and makes rollback a guess.
      - name: Build and push
        id: image
        env:
          URI: ${{ steps.ecr.outputs.registry }}/${{ steps.app.outputs.ecr-repository }}:${{ github.sha }}
        run: |
          set -euo pipefail
          # Already built this commit? Then there is nothing to do.
          #
          # Tags are immutable, deliberately: a tag that can move makes "which
          # code is running" unanswerable and rollback a guess. The cost is that
          # re-running a deploy for the same commit cannot push the same tag,
          # and the push fails with ImageTagAlreadyExists -- which looks like a
          # broken pipeline rather than a pipeline being asked to do something
          # it already did.
          #
          # Re-deploying an unchanged commit is a legitimate thing to want: a
          # rollback, a task that died, a service that needs pushing again. So
          # the existing image is reused and the deploy carries on.
          if aws ecr describe-images \
               --repository-name "${{ steps.app.outputs.ecr-repository }}" \
               --image-ids imageTag="${{ github.sha }}" >/dev/null 2>&1; then
            echo "::notice::${{ github.sha }} is already in ECR; reusing it"
            echo "uri=$URI" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          args=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            args+=(--build-arg "$line")
          done <<< "${{ inputs.build-args }}"

          docker build \
            -f "${{ inputs.docker-context }}/${{ inputs.dockerfile }}" \
            "${args[@]}" \
            -t "$URI" \
            "${{ inputs.docker-context }}"
          docker push "$URI"
          echo "uri=$URI" >> "$GITHUB_OUTPUT"

      # Read before writing. This is what the service goes back to if the new
      # revision does not come up.
      - name: Note what is running now
        id: previous
        run: |
          set -euo pipefail
          arn=$(aws ecs describe-services \
            --cluster "${{ inputs.cluster }}" \
            --services "${{ steps.app.outputs.service }}" \
            --query 'services[0].taskDefinition' --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"
          echo "Currently running: $arn"

      - name: Fetch the task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ steps.app.outputs.task-family }}" \
            --query taskDefinition > task-definition.json

      - name: Point it at the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ steps.app.outputs.app }}
          image: ${{ steps.image.outputs.uri }}

      - name: Deploy and wait for it to settle
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ inputs.cluster }}
          service: ${{ steps.app.outputs.service }}
          wait-for-service-stability: true
          wait-for-minutes: ${{ inputs.wait-minutes }}

      # Stable means the tasks stayed up. It does not mean the application can
      # reach its database, which is the failure worth catching.
      - name: Health check
        if: inputs.health-url != ''
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 "${{ inputs.health-url }}" > /tmp/health.json; then
              echo "healthy:"; cat /tmp/health.json; exit 0
            fi
            echo "attempt $i: no answer yet"; sleep 6
          done
          echo "::error::${{ inputs.health-url }} did not answer after 10 attempts"
          exit 1

      # Runs when the deployment failed to stabilise or the health check did not
      # answer. Puts the previous revision back and waits for it, so the job
      # does not go red while the service is still mid-flight.
      - name: Roll back
        if: failure() && steps.previous.outputs.arn != ''
        run: |
          set -euo pipefail
          echo "::warning::Rolling ${{ steps.app.outputs.service }} back to ${{ steps.previous.outputs.arn }}"
          aws ecs update-service \
            --cluster "${{ inputs.cluster }}" \
            --service "${{ steps.app.outputs.service }}" \
            --task-definition "${{ steps.previous.outputs.arn }}" >/dev/null
          aws ecs wait services-stable \
            --cluster "${{ inputs.cluster }}" \
            --services "${{ steps.app.outputs.service }}"
          echo "Rolled back."

      - name: Say what is running
        run: |
          echo "### ${{ steps.app.outputs.app }} deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| image | \`${{ steps.image.outputs.uri }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| cluster | ${{ inputs.cluster }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| service | ${{ steps.app.outputs.service }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
